name: Build Mod DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build DLL
      run: dotnet build -c Release

    - name: Upload DLL File
      uses: actions/upload-artifact@v4
      with:
        name: DimraethLootMod-DLL
        path: bin/Release/**/DimraethGuaranteedLoot.dll
